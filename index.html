<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI — Dynamic Assistant</title>
  <style>   /* =========================================
       1. DESIGN TOKENS (CSS Custom Properties)
       ========================================= */
    :root {
      --bg-canvas: #0f172a;
      --bg-surface: #1e293b;
      --bg-elevated: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --user-bubble: #3b82f6;
      --bot-bubble: #334155;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 9999px;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* =========================================
       2. RESET & LAYOUT ARCHITECTURE
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 85vh;
      max-height: 760px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================================
       3. HEADER & STATUS INDICATOR
       ========================================= */
    .chat-header {
      padding: 16px 20px;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }

    .bot-info h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      color: var(--text-main);
      background-color: var(--bg-elevated);
    }

    /* =========================================
       4. MESSAGE STREAM & BUBBLES
       ========================================= */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Custom Scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background-color: var(--bg-elevated);
      border-radius: var(--radius-pill);
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-wrapper.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.925rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background-color: var(--bot-bubble);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .timestamp {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* =========================================
       5. TYPING INDICATOR ANIMATION
       ========================================= */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 14px 18px;
      background-color: var(--bot-bubble);
      border-radius: var(--radius-md);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================
       6. QUICK REPLIES & COMPOSER BAR
       ========================================= */
    .quick-replies {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      overflow-x: auto;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
    }

    .quick-replies::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      background-color: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .chip:hover {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .chip:active {
      transform: scale(0.96);
    }

    .chat-input-area {
      padding: 14px 20px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 12px 18px;
      color: var(--text-main);
      font-size: 0.925rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background-color: var(--primary);
      border: none;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-send:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <main class="chat-container" role="region" aria-label="Chat Assistant">
    <!-- Header -->
    <header class="chat-header">
      <div class="bot-profile">
        <div class="avatar" aria-hidden="true">NX</div>
        <div class="bot-info">
          <h1>Nexus Assistant</h1>
          <div class="status">
            <span class="status-dot"></span>
            <span>Online & Ready</span>
          </div>
        </div>
      </div>
      <button type="button" class="btn-clear" id="clearChatBtn" aria-label="Clear conversation">
        Clear
      </button>
    </header>

    <!-- Message Stream (aria-live ensures screen readers announce new messages) -->
    <section class="chat-messages" id="chatMessages" aria-live="polite"></section>

    <!-- Contextual Quick Replies -->
    <div class="quick-replies" id="quickReplies" role="group" aria-label="Suggested prompts">
      <button type="button" class="chip" data-prompt="What can you do?">What can you do?</button>
      <button type="button" class="chip" data-prompt="Tell me a programming joke">Tell me a joke</button>
      <button type="button" class="chip" data-prompt="What is the current time?">Current time</button>
      <button type="button" class="chip" data-prompt="How do I connect an API?">API Integration</button>
    </div>

    <!-- Input Composer -->
    <form class="chat-input-area" id="chatForm">
      <input
        type="text"
        id="userInput"
        class="chat-input"
        placeholder="Ask me anything..."
        autocomplete="off"
        required
      />
      <button type="submit" class="btn-send" id="sendBtn" aria-label="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </main>

  <script>
    /**
     * Frontend Architecture: Modular Chat Controller
     * Separates DOM rendering, state management, and response engine.
     */
    class DynamicChatbot {
      constructor() {
        // DOM Elements
        this.messagesContainer = document.getElementById('chatMessages');
        this.chatForm = document.getElementById('chatForm');
        this.userInput = document.getElementById('userInput');
        this.clearBtn = document.getElementById('clearChatBtn');
        this.quickReplies = document.getElementById('quickReplies');

        // Knowledge Base / Intent Rules
        this.intents = [
          {
            keywords: ['hello', 'hi', 'hey', 'greetings'],
            responses: [
              "Hello! How can I help you build or solve something today?",
              "Hey there! What's on your mind?"
            ]
          },
          {
            keywords: ['what can you do', 'help', 'features'],
            responses: [
              "I'm a dynamic frontend chatbot! Right now I run on local intent-matching, simulate human typing latency, and support quick-reply chips. You can easily swap my `generateResponse()` method with a real LLM API."
            ]
          },
          {
            keywords: ['joke', 'funny'],
            responses: [
              "Why do programmers prefer dark mode? Because light attracts bugs.",
              "A SQL query walks into a bar, walks up to two tables, and asks: 'Can I join you?'"
            ]
          },
          {
            keywords: ['time', 'clock', 'date'],
            responses: [
              () => `The current local time is ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} on ${new Date().toLocaleDateString()}.`
            ]
          },
          {
            keywords: ['api', 'connect', 'openai', 'gemini', 'backend'],
            responses: [
              "To connect a live AI API, replace the `getBotReply()` method with an `async fetch()` POST call to your backend proxy endpoint, then stream or render the JSON response."
            ]
          }
        ];

        this.init();
      }

      init() {
        // Event Listeners
        this.chatForm.addEventListener('submit', (e) => this.handleFormSubmit(e));
        this.clearBtn.addEventListener('click', () => this.resetChat());

        // Event Delegation for Quick Reply Chips
        this.quickReplies.addEventListener('click', (e) => {
          if (e.target.classList.contains('chip')) {
            const prompt = e.target.getAttribute('data-prompt');
            this.processUserMessage(prompt);
          }
        });

        // Initial Greeting
        this.resetChat();
      }

      resetChat() {
        this.messagesContainer.innerHTML = '';
        this.appendMessage("Hi! I'm Nexus. Click a suggestion below or type a message to start.", 'bot');
      }

      handleFormSubmit(e) {
        e.preventDefault();
        const text = this.userInput.value.trim();
        if (!text) return;

        this.userInput.value = '';
        this.processUserMessage(text);
      }

      processUserMessage(text) {
        // 1. Render User Message
        this.appendMessage(text, 'user');

        // 2. Show UX Typing Indicator
        const typingId = this.showTypingIndicator();

        // 3. Simulate realistic network/thinking delay (600ms - 1200ms)
        const delay = Math.floor(Math.random() * 600) + 600;

        setTimeout(() => {
          this.removeTypingIndicator(typingId);
          const reply = this.generateResponse(text);
          this.appendMessage(reply, 'bot');
        }, delay);
      }

      /**
       * XSS-Safe Message Renderer
       * Uses textContent instead of innerHTML to prevent script injection.
       */
      appendMessage(text, sender) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        const time = document.createElement('span');
        time.className = 'timestamp';
        time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        wrapper.appendChild(bubble);
        wrapper.appendChild(time);
        this.messagesContainer.appendChild(wrapper);

        this.scrollToBottom();
      }

      showTypingIndicator() {
        const id = 'typing-' + Date.now();
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper bot';
        wrapper.id = id;

        wrapper.innerHTML = `
          <div class="typing-indicator" aria-label="Assistant is typing">
            <span></span><span></span><span></span>
          </div>
        `;

        this.messagesContainer.appendChild(wrapper);
        this.scrollToBottom();
        return id;
      }

      removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }

      scrollToBottom() {
        this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
      }

      /**
       * Dynamic Intent Engine
       * Swap this method with an async fetch() call to connect a live LLM.
       */
      generateResponse(input) {
        const normalized = input.toLowerCase();

        for (const intent of this.intents) {
          if (intent.keywords.some(keyword => normalized.includes(keyword))) {
            const match = intent.responses[Math.floor(Math.random() * intent.responses.length)];
            return typeof match === 'function' ? match() : match;
          }
        }

        // Dynamic Fallback Response
        return `You asked about "${input}". I don't have a specific rule for that yet, but you can add keywords to my \`intents\` array or wire me up to an AI API!`;
      }
    }

    // Initialize Application
    document.addEventListener('DOMContentLoaded', () => {
      new DynamicChatbot();
    });
  </script>
</body>
</html>
